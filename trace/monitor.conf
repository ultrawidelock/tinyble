# M0 baseline capture: the door-lock sample as shipped, plus Zephyr's HCI
# monitor on RTT up-buffer 1 ("btmonitor"). The text console stays on buffer 0.
# Every HCI command, event and ACL packet crossing hci_core is copied out.
CONFIG_BT_DEBUG_MONITOR_RTT=y
# Two buffers of this size: a staging copy of one packet and the RTT ring.
# 4 KB holds about 16 full-size ACL packets between host polls.
CONFIG_BT_DEBUG_MONITOR_RTT_BUFFER_SIZE=4096
