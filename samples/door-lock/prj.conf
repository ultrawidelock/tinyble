# tinytalk's door-lock (samples/door-lock/prj.conf) with BLE on tinyble. The
# tinytalk, crypto, Thread and logging sections are tinytalk's values; its
# comments there give the measurements behind them.

# ---- tinytalk -----------------------------------------------------------------
CONFIG_TINYTALK=y
CONFIG_TINYTALK_BLE=n
CONFIG_TINYTALK_THREAD=y
CONFIG_TINYTALK_DOOR_LOCK=y
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000
CONFIG_LIS2DH=n
CONFIG_I2C=n
CONFIG_SIZE_OPTIMIZATIONS=y
# Both lines, or LTO silently drops out of .config.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
# PASE runs here, and now tinyble too.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144

# ---- BLE: tinyble on raw HCI to the SDC ------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_TINYBLE=y
CONFIG_TINYBLE_TINYTALK=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=n
CONFIG_BT_LL_SOFTDEVICE_PERIPHERAL=y
CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_LE_PING=n
# Raw HCI leaves these on; Zephyr's host turns them off for tinytalk's build,
# which paired with Apple Home without them.
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_FILTER_ACCEPT_LIST=n
CONFIG_BT_CTLR_CONN_RSSI=n
CONFIG_BT_HCI_VS=n
# tinyble never turns on controller-to-host flow control.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y
# DLE 251 B: tinyble drops an L2CAP PDU split across ACL packets.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# M2's pools, not yet proven with an iPhone.
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_ACL_TX_COUNT=1

# ---- crypto: PSA on nrf_oberon ---------------------------------------------------
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=1024
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# ---- Thread: an OpenThread MTD ------------------------------------------------------
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=4096
CONFIG_OPENTHREAD_PING_SENDER=n
CONFIG_OPENTHREAD_UPTIME=n
CONFIG_OPENTHREAD_THREAD_VERSION_1_1=y

# ---- logging: RTT ----------------------------------------------------------------------
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
