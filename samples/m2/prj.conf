# M2: tinyble on raw HCI to the SDC, one peripheral link, legacy advertising.
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_TINYBLE=y

CONFIG_BT_MAX_CONN=1
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=n

# Peripheral-only SDC library; Coded PHY would force the multirole one.
CONFIG_BT_LL_SOFTDEVICE_PERIPHERAL=y
CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_LE_PING=n
# Raw HCI leaves these on; Zephyr's host turns them off for the door-lock.
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_FILTER_ACCEPT_LIST=n
CONFIG_BT_CTLR_CONN_RSSI=n
CONFIG_BT_HCI_VS=n
# tinyble never turns on controller-to-host flow control.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y

# DLE 251 B, so one ACL packet is one L2CAP PDU (247 B ATT MTU).
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Smallest pools; whether they keep up with an iPhone is the M2 bench test.
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_ACL_TX_COUNT=1

# No console: M2 measures the BLE path. Add trace/monitor.conf for an HCI trace.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
